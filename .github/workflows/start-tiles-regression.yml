name: Ten categorized Start tiles regression
on:
  pull_request:
    paths:
      - 'app/src/main/java/com/nthexperience/desktop/StartMenu.java'
      - 'app/src/main/java/com/nthexperience/desktop/TenStart*.java'
      - 'app/src/main/java/com/nthexperience/desktop/TenLiveTiles.java'
      - 'app/src/androidTest/java/com/nthexperience/desktop/TenStartTilesSmoke.java'
      - '.github/workflows/start-tiles-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ten-start-${{ github.ref }}
  cancel-in-progress: true
jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :fixture:assembleDebug --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.api == 30 && 'default' || 'aosp_atd' }}
          profile: pixel_2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash checks/run-ten-start-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ten-start-evidence-api-${{ matrix.api }}
          path: |
            ten-start-*.txt
            ten-window-*.txt
            ten-taskbar-size-smoke.txt
            screenshots/
            app/build/test-results/testDebugUnitTest/
            app/build/outputs/apk/debug/app-debug.apk
