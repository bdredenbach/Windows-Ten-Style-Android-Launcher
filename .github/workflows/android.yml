name: Nth Desktop Ten preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ten-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check mixed Start tile geometry and consent
        run: |
          mkdir -p build/ten-checks
          javac -d build/ten-checks app/src/main/java/com/nthexperience/desktop/TenTileLayout.java app/src/main/java/com/nthexperience/desktop/CloudConsent.java checks/TenTileLayoutCheck.java
          java -cp build/ten-checks com.nthexperience.desktop.TenTileLayoutCheck
      - run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Nth-Desktop-Ten-0.1.0-api-${{ matrix.api }}
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Ten native regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.api == 30 && 'default' || 'aosp_atd' }}
          profile: pixel_2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash checks/run-ten-checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ten-evidence-api-${{ matrix.api }}
          path: |
            ten-smoke.txt
            screenshots/
