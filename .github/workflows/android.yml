name: Nth Desktop Ten build and regression
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'THIRD_PARTY_NOTICES.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ten-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
        orientation: [portrait, landscape]
        mode: [light, dark]
    env:
      TEN_THEME_ORIENTATION: ${{ matrix.orientation }}
      TEN_THEME_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check mixed Start tile geometry and consent
        run: |
          mkdir -p build/ten-checks
          javac -d build/ten-checks app/src/main/java/com/nthexperience/desktop/TenTileLayout.java app/src/main/java/com/nthexperience/desktop/CloudConsent.java checks/TenTileLayoutCheck.java
          java -cp build/ten-checks com.nthexperience.desktop.TenTileLayoutCheck
          javac -d build/ten-checks app/src/main/java/com/nthexperience/desktop/TenTileLayout.java app/src/main/java/com/nthexperience/desktop/TenAiPolicy.java app/src/main/java/com/nthexperience/desktop/TenWritingPrompts.java app/src/main/java/com/nthexperience/desktop/TenSettingsCatalog.java checks/TenPolishCheck.java
          java -cp build/ten-checks com.nthexperience.desktop.TenPolishCheck
          javac -d build/ten-checks app/src/main/java/com/nthexperience/desktop/TenSettingsCatalog.java app/src/main/java/com/nthexperience/desktop/TenNotaActions.java checks/TenNotaActionsCheck.java
          java -cp build/ten-checks com.nthexperience.desktop.TenNotaActionsCheck
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :fixture:assembleDebug :installprobe:assembleDebug --no-daemon
      - name: Check packaged runners and notification permission
        run: python3 checks/CheckTenManifest.py
      - uses: actions/upload-artifact@v4
        if: matrix.orientation == 'portrait' && matrix.mode == 'light'
        with:
          name: Nth-Desktop-Ten-0.23.0-api-${{ matrix.api }}
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Ten native regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.api == 30 && 'default' || 'aosp_atd' }}
          profile: pixel_2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash checks/run-ten-checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ten-evidence-api-${{ matrix.api }}-${{ matrix.orientation }}-${{ matrix.mode }}
          path: |
            ten-smoke.txt
            ten-polish-smoke.txt
            ten-shell-smoke.txt
            ten-theme-smoke.txt
            ten-workspace-smoke.txt
            ten-theme-matrix-smoke.txt
            ten-feed-smoke.txt
            ten-commands-smoke.txt
            ten-accent-smoke.txt
            ten-reference-smoke.txt
            ten-audit-smoke.txt
            ten-dark-mode-smoke.txt
            ten-interaction-smoke.txt
            ten-taskbar-size-smoke.txt
            ten-theme-text-smoke.txt
            ten-nota-smoke.txt
            ten-nota-cold-smoke.txt
            ten-facet-*.txt
            app/build/test-results/testDebugUnitTest/
            screenshots/
