name: Ten focused Photo Gallery regression
on:
  push:
    branches: [main]
    paths: ['app/src/androidTest/java/com/nthexperience/desktop/PhotoSmoke.java']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ten-photo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :fixture:assembleDebug --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          TEN_FACET_ONLY: photos
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.api == 30 && 'default' || 'aosp_atd' }}
          profile: pixel_2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r fixture/build/outputs/apk/debug/fixture-debug.apk
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            bash checks/run-ten-facets.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ten-photo-evidence-api-${{ matrix.api }}
          path: |
            ten-facet-photos.txt
            screenshots/facets/photos/
            app/build/outputs/apk/debug/app-debug.apk
