plugins { id 'com.android.application' }
android {
    namespace 'com.nthexperience.desktop'
    compileSdk 36
    buildFeatures { buildConfig = true }
    defaultConfig {
        applicationId rootProject.ext.launcherApplicationId
        manifestPlaceholders.launcherApplicationId = applicationId
        buildConfigField 'String', 'AI_GATEWAY_URL', '"https://nth-nota-free-ai.bdredenbach.workers.dev/v1/write"'
        minSdk 26
        targetSdk 36
        versionCode 22
        versionName '0.22.0'
        testInstrumentationRunner 'com.nthexperience.desktop.TenSmoke'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The engine is the installed Android WebView, independently updated by its provider.
dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    implementation "com.google.mlkit:genai-prompt:1.0.0-beta4"
    implementation "androidx.webkit:webkit:1.13.0"
    implementation "androidx.media3:media3-exoplayer:1.10.1"
}
